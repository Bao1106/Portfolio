<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>Portfolio</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                   background: #17150f; font-family: system-ui, sans-serif; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #17150f; }
      #bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
             width: 360px; height: 6px; background: #2a2620; border-radius: 3px; }
      #fill { width: 0; height: 100%; background: #70b8cc; border-radius: 3px;
              transition: width .15s linear; }
      #fps { position: fixed; right: 10px; top: 8px; display: none; color: #70b8cc;
             font: 12px ui-monospace, monospace; background: rgba(0,0,0,.55);
             padding: 3px 7px; border-radius: 4px; pointer-events: none; }
      #label { position: absolute; left: 50%; top: calc(50% + 24px);
               transform: translateX(-50%); color: #6a635a; font-size: 13px;
               letter-spacing: .08em; }
      #back-2d { position: fixed; left: 14px; top: 12px; z-index: 10;
                 color: #a9a094; font: 13px system-ui, sans-serif; text-decoration: none;
                 background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 8px;
                 border: 1px solid rgba(255,255,255,.08); transition: color .2s, border-color .2s; }
      #back-2d:hover { color: #e6e6e6; border-color: rgba(255,255,255,.2); }
    </style>
  </head>
  <body>
    <!-- Bản 2D nằm ở thư mục gốc của site, bản Unity WebGL này ở /3d/ -->
    <a id="back-2d" href="../">← Về bản portfolio 2D</a>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <div id="bar"><div id="fill"></div></div>
    <div id="label">LOADING</div>
    <div id="fps"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var bar = document.querySelector("#bar");
      var fill = document.querySelector("#fill");
      var label = document.querySelector("#label");

      var config = {
        dataUrl: "Build/Build.data.unityweb",
        frameworkUrl: "Build/Build.framework.js.unityweb",
        codeUrl: "Build/Build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Portfolio",
        productVersion: "0.1.0",
      };

      // Unity dong bo render target = kich thuoc CSS x devicePixelRatio.
      // Man 1080p o muc phong 125% cua Windows cho dpr 1.25 -> 2400x1350 = 3.24 MP,
      // gap 1.6 lan so pixel that su nhin thay; man 1440p con te hon.
      // Chan tran o muc 1080p: doi tuong la chibi low-poly, them pixel khong doi lai gi.
      var budget = 1920 * 1080;
      var area = Math.max(1, innerWidth * innerHeight);
      config.devicePixelRatio = Math.min(devicePixelRatio, Math.sqrt(budget / area));

      if (location.hash === "#fps") {
        var meter = document.querySelector("#fps");
        meter.style.display = "block";
        var frames = 0, mark = performance.now();
        var gpu = function () {
          try {
            var gl = canvas.getContext("webgl2");
            var ext = gl.getExtension("WEBGL_debug_renderer_info");
            var name = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
            // "ANGLE (NVIDIA, GeForce ... , D3D11)" -> lay manh giua; "Google SwiftShader" giu nguyen
            var parts = name.split(",");
            return (parts.length > 1 ? parts[1] : name).trim().slice(0, 40);
          } catch (e) { return "?"; }
        };
        (function tick() {
          frames++;
          var now = performance.now();
          if (now - mark >= 1000) {
            meter.textContent = Math.round(frames * 1000 / (now - mark))
              + " fps  " + canvas.width + "x" + canvas.height + "  " + gpu();
            frames = 0; mark = now;
          }
          requestAnimationFrame(tick);
        })();
      }

      var script = document.createElement("script");
      script.src = "Build/Build.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          fill.style.width = (100 * p) + "%";
        }).then(function () {
          bar.style.display = "none";
          label.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          label.textContent = message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
