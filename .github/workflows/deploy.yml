name: Deploy portfolio (2D + 3D)

# Repo chỉ có 1 site GitHub Pages, nên workflow này gom cả hai bản vào một lần deploy:
#   /            -> bản 2D          (branch 2d_web,  file tĩnh)
#   /3d/         -> bản 3D Unity WebGL (branch 3d_web, file tĩnh — không còn build step)
# File này giống hệt nhau ở cả 2 branch, push branch nào cũng deploy đủ cả hai.
on:
  push:
    branches: [2d_web, 3d_web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lay ban 2D
        uses: actions/checkout@v4
        with:
          ref: 2d_web
          path: site-2d

      - name: Lay ban 3D (Unity WebGL, da build san)
        uses: actions/checkout@v4
        with:
          ref: 3d_web
          path: site-3d

      - name: Gom thanh mot site
        run: |
          mkdir -p _site/3d
          cp site-2d/index.html _site/
          cp -r site-2d/assets _site/
          cp -r site-3d/index.html site-3d/Build site-3d/StreamingAssets _site/3d/
          echo "--- noi dung _site ---"
          find _site -maxdepth 2 | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
