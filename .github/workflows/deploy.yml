name: Deploy 2D portfolio

# Repo dùng chung 1 site Pages với branch 3d_web -> branch nào chạy sau thì bản đó lên sóng.
# Nút "Run workflow" chỉ hiện khi file workflow nằm ở default branch (đang là 3d_web),
# nên ở đây dùng trigger push để deploy được từ chính branch này.
on:
  push:
    branches: [2d_web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Gom file tinh vao _site (khong day .git len Pages)
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
